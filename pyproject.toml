[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-newsletter-studio"
version = "2.0.0"
description = "Local-first newsletter automation with nine MCP servers, multi-provider LLMs and quota-aware orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<0.29", "pydantic>=2.11,<3", "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2", "Jinja2>=3.1.6,<4", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "typer>=0.15,<1", "rich>=13.9,<16",
  "defusedxml>=0.7.1,<1", "filelock>=3.18,<4", "tzdata>=2025.1", "beautifulsoup4>=4.13,<5", "tinycss2>=1.4,<2", "markdown-it-py>=3,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pytest-cov>=6,<8", "playwright>=1.50,<2", "build>=1,<2"]
[project.scripts]
newsletter = "newsletter_mcp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
newsletter_mcp = ["templates/*.html", "static/*.css", "static/*.js", "prompts/*.txt"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py311"
